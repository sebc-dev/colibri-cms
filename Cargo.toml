[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
cms-core = { path = "crates/core" }
cms-app = { path = "crates/app" }
cms-html = { path = "crates/html" }
serde_json = "1.0.151"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
# Dépendances inutilisées : tenues par `cargo shear --deny-warnings` (D13), pas par le lint
# `unused_crate_dependencies`, qui se déclenche à tort sur les cibles de test.

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
