<style>body{margin:0;padding:var(--space-6);background:var(--surface);font-family:var(--font-sans)}.row{display:flex;flex-wrap:wrap;gap:var(--space-3);align-items:center}.col{display:flex;flex-direction:column;gap:var(--space-4)}.tag{font-size:var(--caption-size);color:var(--ink-muted);text-transform:uppercase;letter-spacing:.06em}</style>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.ColibriCMSDesignSystem_aa1b5b;
const { Field, TextInput, Textarea, Select, Checkbox, Switch, DropZone } = NS;
function Demo() {
  const [v, setV] = React.useState('Pièces montées');
  const [c, setC] = React.useState(true);
  const [s, setS] = React.useState(true);
  return (
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--space-6)'}}>
      <div className="col">
        <Field label="Titre de la page" htmlFor="t"><TextInput id="t" value={v} onChange={setV} /></Field>
        <Field label="Adresse de la page" htmlFor="u" help="Visible dans la barre du navigateur.">
          <TextInput id="u" mono prefix="monsite.fr" value="/galerie/pieces-montees" onChange={()=>{}} />
        </Field>
        <Field label="Texte alternatif" htmlFor="a" error="Décrivez la photo : ce texte est lu à voix haute.">
          <TextInput id="a" invalid value="" onChange={()=>{}} placeholder="Une pièce montée à trois étages" />
        </Field>
        <Field label="État de la demande" htmlFor="e">
          <Select id="e" value="devis-envoye" onChange={()=>{}} options={[{value:'sans-suite',label:'Sans suite'},{value:'devis-envoye',label:'Devis envoyé'},{value:'commande',label:'Commande'}]} />
        </Field>
      </div>
      <div className="col">
        <Field label="Description" htmlFor="d" optional><Textarea id="d" rows={3} value="Chaque pièce est montée le matin même." onChange={()=>{}} /></Field>

        <DropZone help="JPEG ou PNG, 10 Mo au maximum par photo." />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
