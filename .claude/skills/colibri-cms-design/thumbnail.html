<!doctype html><html lang="fr"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.main{background:#0E6B55;display:grid;place-items:center}
.main img{width:640px;height:auto;display:block}
.strip{display:grid;grid-template-rows:repeat(4,1fr)}
.strip div{width:100%;height:100%}</style></head><body>
<div class="main"><img src="assets/logo-colibri-clair.svg" alt="Colibri CMS"></div>
<div class="strip"><div style="background:#FBE3EC"></div><div style="background:#F38020"></div><div style="background:#B4235A"></div><div style="background:#17201C"></div></div>
</body></html>
