<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Plumage</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.n{font-size:12px;line-height:15px;font-weight:600}
.h{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--ink-muted)}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--plumage)"></div><div class="n">plumage</div><div class="h">#0E6B55</div></div>
<div class="sw"><div class="chip" style="background:var(--plumage-soft)"></div><div class="n">plumage-soft</div><div class="h">#DDF1E8</div></div>
<div class="sw"><div class="chip" style="background:var(--on-plumage)"></div><div class="n">on-plumage</div><div class="h">#FFFFFF</div></div>
<div class="sw"><div class="chip" style="background:var(--plumage);display:grid;place-items:center;color:var(--on-plumage);font-size:13px;font-weight:600">Publier</div><div class="n">aplat + on-plumage</div><div class="h">jamais un blanc codé en dur</div></div>
</div></body></html>
