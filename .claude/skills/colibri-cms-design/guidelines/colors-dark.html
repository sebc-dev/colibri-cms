<!-- @dsCard group="Colors" viewport="700x180" name="Thème sombre" subtitle="Même sémantique, valeurs déplacées : plumage s'éclaircit, gorge devient rose" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Sombre</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.n{font-size:12px;line-height:15px;font-weight:600}
.h{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--ink-muted)}body{background:#141816}.n{color:#EEF1EC}</style></head><body><div data-theme="dark" class="grid" style="background:var(--surface)">
<div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="h">#1C211F</div></div>
<div class="sw"><div class="chip" style="background:var(--ink)"></div><div class="n">ink</div><div class="h">#EEF1EC</div></div>
<div class="sw"><div class="chip" style="background:var(--plumage)"></div><div class="n">plumage</div><div class="h">#4FD1A5</div></div>
<div class="sw"><div class="chip" style="background:var(--gorge)"></div><div class="n">gorge</div><div class="h">#FF7AA8</div></div>
</div></body></html>
