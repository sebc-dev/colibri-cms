<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.n{font-size:12px;line-height:15px;font-weight:600}
.h{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--ink-muted)}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--surface)"></div><div class="n">surface</div><div class="h">#F7F6F1</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-raised)"></div><div class="n">surface-raised</div><div class="h">#FFFFFF</div></div>
<div class="sw"><div class="chip" style="background:var(--surface-sunken)"></div><div class="n">surface-sunken</div><div class="h">#EFEDE6</div></div>
<div class="sw"><div class="chip" style="background:var(--line)"></div><div class="n">line</div><div class="h">#E1DFD6</div></div>
</div></body></html>
