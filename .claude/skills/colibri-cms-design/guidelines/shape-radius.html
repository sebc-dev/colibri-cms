<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Rayons</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}.bx{height:56px;background:var(--surface-raised);border:1px solid var(--line-strong)}.n{font-size:12px;font-weight:600;margin-top:6px}.h{font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)}</style></head><body><div class="grid">
<div><div class="bx" style="border-radius:var(--radius-sm)"></div><div class="n">radius-sm · 4px</div><div class="h">champs, vignettes</div></div>
<div><div class="bx" style="border-radius:var(--radius-md)"></div><div class="n">radius-md · 6px</div><div class="h">boutons, cartes, menus</div></div>
<div><div class="bx" style="border-radius:var(--radius-lg)"></div><div class="n">radius-lg · 10px</div><div class="h">panneaux, modales, dépôt</div></div>
<div><div class="bx" style="border-radius:var(--radius-pill)"></div><div class="n">radius-pill</div><div class="h">badges, jauge</div></div>
</div></body></html>
