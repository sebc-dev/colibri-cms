<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Gorge</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.n{font-size:12px;line-height:15px;font-weight:600}
.h{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--ink-muted)}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--gorge)"></div><div class="n">gorge</div><div class="h">#B4235A</div></div>
<div class="sw"><div class="chip" style="background:var(--gorge-soft)"></div><div class="n">gorge-soft</div><div class="h">#FBE3EC</div></div>
<div class="sw" style="grid-column:span 2"><div class="chip" style="background:var(--gorge-soft);display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--gorge);font-size:13px;font-weight:500"><span style="width:6px;height:6px;border-radius:999px;background:var(--gorge)"></span>Modifié, non publié</div><div class="n">badge d'état</div><div class="h">pastille 6 px + libellé label</div></div>
</div></body></html>
