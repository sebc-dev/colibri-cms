<!-- @dsCard group="Spacing" viewport="700x150" name="Focus clavier" subtitle="2 px de surface, puis 2 px de focus-ring (alias de plumage), au clavier seulement" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Focus</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}</style></head><body><div style="display:flex;gap:24px;align-items:center">
<button style="font:600 15px/22px var(--font-sans);background:var(--plumage);color:var(--on-plumage);border:none;border-radius:var(--radius-md);padding:8px 16px;outline:2px solid var(--focus-ring);outline-offset:2px">Publier</button>
<input value="Pièces montées" style="font:400 15px/22px var(--font-sans);border:1px solid var(--line-strong);border-radius:var(--radius-sm);padding:8px 12px;outline:2px solid var(--focus-ring);outline-offset:2px">
<span style="font-family:var(--font-mono);font-size:11px;color:var(--ink-muted)">:focus-visible uniquement</span>
</div></body></html>
