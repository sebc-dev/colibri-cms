<!-- @dsCard group="Colors" viewport="700x170" name="Signaux — ambre, danger, info" subtitle="Chaque signal a son fond -soft ; on n'alarme pas tant qu'il reste de la marge" -->
<!doctype html><html lang="fr"><head><meta charset="utf-8"><title>Signaux</title><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:20px 24px;background:var(--surface);font-family:var(--font-sans);color:var(--ink)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.sw{display:flex;flex-direction:column;gap:6px}
.chip{height:52px;border-radius:var(--radius-sm);border:1px solid var(--line)}
.n{font-size:12px;line-height:15px;font-weight:600}
.h{font-family:var(--font-mono);font-size:11px;line-height:14px;color:var(--ink-muted)}.grid{grid-template-columns:repeat(6,1fr)}</style></head><body><div class="grid">
<div class="sw"><div class="chip" style="background:var(--ambre)"></div><div class="n">ambre</div><div class="h">#8A5A00</div></div>
<div class="sw"><div class="chip" style="background:var(--ambre-soft)"></div><div class="n">ambre-soft</div><div class="h">#FCEFD2</div></div>
<div class="sw"><div class="chip" style="background:var(--danger)"></div><div class="n">danger</div><div class="h">#B42318</div></div>
<div class="sw"><div class="chip" style="background:var(--danger-soft)"></div><div class="n">danger-soft</div><div class="h">#FDE7E5</div></div>
<div class="sw"><div class="chip" style="background:var(--info)"></div><div class="n">info</div><div class="h">#1D4F91</div></div>
<div class="sw"><div class="chip" style="background:var(--info-soft)"></div><div class="n">info-soft</div><div class="h">#E3ECF9</div></div>
</div></body></html>
