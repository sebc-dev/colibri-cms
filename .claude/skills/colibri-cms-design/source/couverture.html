<!doctype html>

<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .plumage { fill:var(--plumage); }
  .tint { fill:var(--plumage-soft); }
  .gorge { fill:var(--gorge); }
  .deep { fill:var(--ink); }
  .nuage { fill:var(--nuage); }
  .quill { fill:var(--surface); }
  .words { position:absolute; left:var(--space-6); right:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-family:var(--font-display); font-size:104px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--ink); }

<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      five tapered feather blades fanned from one pivot below the box: plumage 400 long (the brand, longest) · ink 300 long bleeding off the top · plumage-soft 370 (the tint) · gorge 176 (the ruby throat, short: it only means "not yet published") · nuage 120, a sliver (the Cloudflare nod) — about 40% of 960×288
  arrangement a wing: blades fanned up and to the left, 112° to 167°, from a pivot off the bottom-right corner — the direction the logo's wing points, overlapping at the root like the logo's feathers
  pattern     literal motif, the logo's wing: four hairline quills cut in the ground colour between the blades (fan pitch 14°), so each blade reads as a separate feather
  scales      blade widths in space-6 / space-8 multiples, quills space-2 wide at the root; no radii — the logo draws with straight cuts and sharp tips
-->
