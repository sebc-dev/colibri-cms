# Portail de contrôles — ColibriCMS
#
# Ce fichier est le contrôle réel ; docs/ci.md en est la synthèse et le mode d'emploi.
# Les NOMS DE JOBS ci-dessous sont les noms des checks requis de la protection de
# branche, caractère pour caractère. Les renommer sans mettre à jour le ruleset laisse
# un check requis fantôme qui bloque toutes les PR (voir docs/ci.md § Protection).
#
# Bloquants   : build · test · sca · secrets · test-integrity · quality-config-guard
#               suppression-guard · workflow-audit · deps-policy
# Informatifs : lint · coverage · sast   (ils annotent, ils ne sont pas exigés)
#
# Toutes les actions sont épinglées au SHA COMPLET, et toutes les images au DIGEST :
# un tag est mobile, et `workflow-audit` (zizmor) refuse une référence mobile.
#
# GARDE DE SCAFFOLD : le dépôt ne porte encore aucun code (décision du 2026-08-07).
# Les jobs qui dépendent du scaffold testent la présence de package.json et se
# déclarent HORS PORTÉE tant qu'il n'existe pas. Ils passent alors au vert SANS RIEN
# VÉRIFIER — c'est un coût assumé et déclaré, pas un oubli.

name: CI

on:
  # `labeled` et `unlabeled` ne sont PAS dans les types par défaut
  # (opened · synchronize · reopened). Sans eux, poser le label `deps` ou
  # `config-change` ne relance rien, et `gh run rerun` rejoue la charge utile
  # d'origine — donc sans le label. Les deux soupapes seraient inertes.
  # `unlabeled` est là pour la symétrie : retirer le label doit re-bloquer.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Informatif · quelques secondes ────────────────────────────────────────────
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm lint

  # ── Bloquant · dizaines de secondes ───────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      # `--frozen-lockfile` et jamais `pnpm install` nu : sans version figée, la SCA
      # scannerait autre chose que ce qui est installé et ne prouverait rien.
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm typecheck
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm build

  # ── Bloquant · minutes ────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm test

  # ── Informatif · couverture du CODE NOUVEAU, jamais globale ───────────────────
  # Aucun --fail-under : le seuil chiffré est fixé par le chantier de durcissement,
  # une fois mesuré sur du code réel (décision du 2026-08-07).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.scaffold.outputs.ok == 'true'
        run: pnpm coverage
      - if: steps.scaffold.outputs.ok == 'true'
        run: pipx install diff-cover==10.4.2
      - if: steps.scaffold.outputs.ok == 'true'
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: diff-cover coverage/lcov.info --compare-branch="$BASE_REF" --markdown-report "$GITHUB_STEP_SUMMARY"

  # ── Bloquant · dépôt ENTIER, pas le diff ──────────────────────────────────────
  # Une CVE dans une dépendance non touchée par la PR reste exploitable.
  sca:
    name: sca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lockfile
        run: |
          if [ -f pnpm-lock.yaml ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun pnpm-lock.yaml — rien à scanner (docs/ci.md)."
          fi
      - if: steps.lockfile.outputs.ok == 'true'
        uses: google/osv-scanner-action/osv-scanner-action@8deb546fdb875b9996d27d4950be7312dac076a1 # v2.5.0
        with:
          scan-args: |-
            --recursive
            ./

  # ── Bloquant · POLITIQUE D'APPROVISIONNEMENT ─────────────────────────────────
  # Ce que l'OSV-Scanner ne voit PAS : un paquet hostile trop récent pour figurer
  # dans une base de vulnérabilités. C'est le trou par lequel passe le slopsquatting
  # — un nom halluciné par un modèle, enregistré par un tiers. Deux gardes :
  #   a. le cooldown pnpm est déclaré et suffisant (7 jours) ;
  #   b. aucune variation de dépendance n'entre EN SILENCE.
  deps-policy:
    name: deps-policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Cooldown de dépendances et visibilité des variations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'deps') }}
        run: |
          set -uo pipefail
          fail=0
          MIN_AGE=10080   # minutes — 7 jours (docs/ci.md § Approvisionnement)

          # ── a. Le cooldown, dès que le scaffold existe ────────────────────────
          if [ -f package.json ]; then
            if [ ! -f pnpm-workspace.yaml ]; then
              echo "::error title=Cooldown absent::pnpm-workspace.yaml manquant — minimumReleaseAge ne peut pas être déclaré (docs/ci.md)."
              fail=1
            else
              # `s/#.*$//` d'abord : un commentaire YAML en fin de ligne
              # (`minimumReleaseAge: 10080 # 7 jours`) rendrait la valeur non
              # numérique et ferait échouer le contrôle sur sa propre lisibilité.
              age=$(grep -E '^[[:space:]]*minimumReleaseAge:' pnpm-workspace.yaml \
                    | head -1 | sed -E 's/#.*$//; s/.*:[[:space:]]*//' | tr -d '"'\''[:space:]')
              if ! printf '%s' "${age:-}" | grep -qE '^[0-9]+$'; then
                echo "::error title=Cooldown absent::pnpm-workspace.yaml ne déclare pas minimumReleaseAge (attendu : >= ${MIN_AGE})."
                fail=1
              elif [ "$age" -lt "$MIN_AGE" ]; then
                echo "::error title=Cooldown trop court::minimumReleaseAge=${age} < ${MIN_AGE} minutes (7 jours)."
                fail=1
              else
                echo "Cooldown déclaré : ${age} minutes."
              fi
            fi
          else
            echo "::notice title=Hors portée::Aucun package.json — le cooldown n'a rien à contraindre (docs/ci.md)."
          fi

          # ── b. Aucune variation de dépendance en silence ──────────────────────
          # Le lockfile est le signal qui ne ment pas : il ne change pas sans qu'une
          # dépendance change. On ne surveille que lui — package.json bouge pour
          # mille raisons légitimes, et un contrôle bruyant finit désactivé.
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice title=Hors portée::Pas d'événement pull_request — aucun diff à inspecter."
          elif [ "${HAS_LABEL}" = "true" ]; then
            echo "::notice title=Soupape::Label 'deps' posé sur la PR — variation de dépendance déclarée."
          elif [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- ':(glob)pnpm-lock.yaml' ':(glob)**/pnpm-lock.yaml')" ]; then
            for c in $(git log --format=%H "$BASE_SHA"..HEAD -- ':(glob)pnpm-lock.yaml' ':(glob)**/pnpm-lock.yaml'); do
              msg=$(git log -1 --format=%s "$c")
              case "$msg" in
                build\(deps\):*|chore\(deps\):*|fix\(deps\):*) ;;
                *)
                  echo "::error title=Dépendance modifiée sans déclaration::$c — $msg"
                  fail=1 ;;
              esac
            done
          fi

          exit $fail

  # ── Bloquant · dépôt ENTIER + HISTORIQUE, pas le diff ─────────────────────────
  # Un secret dans un fichier non modifié reste un secret ; un secret retiré de
  # l'arbre de travail mais présent dans l'historique reste exposé (dépôt PUBLIC).
  # `--results=verified` : seuls les credentials RÉELLEMENT ACTIFS remontent — un
  # scanner par entropie ferait du bruit sur les fixtures et finirait désactivé.
  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: TruffleHog — historique complet, credentials vérifiés
        run: |
          docker run --rm -v "$PWD":/repo \
            ghcr.io/trufflesecurity/trufflehog:3.96.0@sha256:aa821cf4ace8861c7d096d83818cdf7bb9719028a52d37a52eaad44086a52577 \
            git file:///repo \
            --results=verified \
            --fail \
            --no-update \
            --github-actions

  # ── Informatif · SAST ─────────────────────────────────────────────────────────
  # Taux de faux positifs INCONNU sur ce dépôt : il reste informatif jusqu'à ce que
  # le chantier de durcissement l'ait mesuré. Un contrôle bruyant rendu bloquant
  # trop tôt finit désactivé, et son efficacité tombe alors à zéro.
  # On invoque le binaire `semgrep` : l'action `semgrep/semgrep-action` est ARCHIVÉE
  # depuis le 9 avril 2024 et ne doit jamais être utilisée.
  sast:
    name: sast
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep
        run: |
          semgrep scan \
            --config=p/typescript \
            --config=p/javascript \
            --config=p/owasp-top-ten \
            --error \
            --metrics=off

  # ── Bloquant · AUDIT DES WORKFLOWS EUX-MÊMES ─────────────────────────────────
  # La chaîne d'approvisionnement de la CI est une surface d'attaque à part entière :
  # une action référencée par tag mobile peut être remplacée sous le même nom. zizmor
  # refuse les références non épinglées, les permissions trop larges, l'injection de
  # gabarit et l'empoisonnement de cache. `online-audits: false` : déterminisme total,
  # aucun appel d'API, donc aucune dépendance à une limite de débit.
  workflow-audit:
    name: workflow-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          version: 1.29.0
          inputs: .github/workflows/
          online-audits: false
          advanced-security: false
          annotations: true

  # ── Bloquant · diff des TESTS ─────────────────────────────────────────────────
  # Vise l'agent, pas le code qu'il écrit. Ne peut pas reproduire la règle temporelle
  # du niveau implémentation (« les tests existent, rouges, et ne bougent plus ») :
  # en TDD, la PR d'un lot contient légitimement les tests ET le code. Il porte donc
  # les signaux vrais quel que soit le moment.
  #
  # DEUX RÉGIMES, et la distinction est le cœur du job :
  #   A. endormir un test  → refus sec, aucune issue ;
  #   B. retirer un test ou alléger un oracle → légitime, mais SOUS SIGNATURE.
  # Sans B, le job se contredisait : il disait « la sortie est de retirer le test »
  # et refusait qu'on retire un test. Constaté sur la PR de reprise, où le retrait
  # d'un projet abandonné bloquait sans issue possible.
  test-integrity:
    name: test-integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Intégrité des tests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice title=Hors portée::Pas d'événement pull_request — aucun diff à inspecter."
            exit 0
          fi

          TESTS=(':(glob)**/*.test.ts'   ':(glob)**/*.test.tsx'
                 ':(glob)**/*.spec.ts'   ':(glob)**/*.spec.tsx'
                 ':(glob)tests/**'       ':(glob)e2e/**')

          d() { git diff "$BASE_SHA"...HEAD -- "${TESTS[@]}"; }
          fail=0

          # ── A. Un neutralisant ajouté — AUCUNE soupape ────────────────────
          # Endormir un test n'a jamais de justification recevable : la sortie
          # est de le RETIRER, et retirer est exactement ce que le point B
          # autorise sous signature. C'est la seule branche sans issue, et
          # c'est délibéré.
          neutre=$(d | grep -nE '^\+.*(\.skip\(|\.only\(|\.todo\(|\.fixme\(|\bxit\(|\bxdescribe\(|expect\(true\)\.toBe\(true\)|expect\(1\)\.toBe\(1\))') || true
          if [ -n "$neutre" ]; then
            echo "::error title=Neutralisant ajouté dans un test::$neutre"
            fail=1
          fi

          # ── B. Test supprimé, ou assertions nettes retirées — SOUS SIGNATURE
          # Retirer un test ou alléger un oracle est LÉGITIME (retrait d'un
          # module, refonte) et INDISCERNABLE d'une subversion. On ne l'interdit
          # donc pas : on exige que l'humain le signe de sa main. Même mécanique
          # que `suppression-guard` — un scope de commit ou un label seraient
          # écrits par l'agent lui-même.
          raisons=()
          sup=$(git diff --diff-filter=D --name-only "$BASE_SHA"...HEAD -- "${TESTS[@]}")
          [ -n "$sup" ] && raisons+=("fichier(s) de test supprimé(s)")

          a=$(d | grep -cE '^\+.*(expect\(|assert)') || true
          r=$(d | grep -cE '^-.*(expect\(|assert)') || true
          echo "Assertions — ajoutées: ${a:-0} · retirées: ${r:-0}"
          [ "${r:-0}" -gt "${a:-0}" ] && raisons+=("${r} assertions retirées pour ${a} ajoutées")

          if [ ${#raisons[@]} -gt 0 ]; then
            printf 'Signature exigée — %s\n' "$(IFS='; '; echo "${raisons[*]}")"
            [ -n "$sup" ] && printf '  supprimé : %s\n' $sup
            # Tout commit de l'intervalle qui touche un fichier de test doit
            # être signé : c'est l'ensemble qui porte la responsabilité, pas
            # le seul commit où le compteur bascule.
            mapfile -t touchants < <(git rev-list --no-merges "$BASE_SHA..HEAD" -- "${TESTS[@]}")
            bash .github/scripts/verify-signed-commits.sh \
              .github/allowed_signers "${touchants[@]}" || fail=1
          fi

          exit $fail

  # ── Bloquant · SUPPRESSION DU VÉRIFICATEUR, sous preuve cryptographique ───────
  # Mode de défaillance visé : l'agent ne casse pas le contrôle, il l'ÉTEINT
  # localement — `@ts-ignore`, `as any`, `eslint-disable`, `catch {}` vide. Le
  # signal est déterministe (grep sur les lignes AJOUTÉES, fichiers de test exclus).
  #
  # La soupape n'est PAS un scope de commit : un agent écrit un scope. C'est une
  # SIGNATURE SSH vérifiée contre `.github/allowed_signers`. Fermeture par défaut :
  # sans liste de clés, aucune suppression ne passe.
  #
  # RÉSERVE, et elle est le tout du dispositif : ce garde ne vaut que si la clé
  # privée est HORS D'ATTEINTE de l'agent — clé FIDO2 à contact physique
  # (sk-ssh-ed25519@openssh.com). Une clé logicielle dans ~/.ssh est un fichier que
  # l'agent lit. Voir docs/ci.md § Le garde de suppression.
  suppression-guard:
    name: suppression-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Suppressions du vérificateur — signature exigée
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice title=Hors portée::Pas d'événement pull_request — aucun diff à inspecter."
            exit 0
          fi

          SIGNERS=.github/allowed_signers
          fail=0

          # Sources seulement, tests exclus. La documentation est hors portée :
          # docs/ci.md cite ces motifs et n'a pas à se bloquer elle-même.
          SRC=(':(glob)**/*.ts'  ':(glob)**/*.tsx'   ':(glob)**/*.js'
               ':(glob)**/*.jsx' ':(glob)**/*.mjs'   ':(glob)**/*.cjs'
               ':(glob)**/*.astro'
               ':(exclude,glob)**/*.test.ts'  ':(exclude,glob)**/*.test.tsx'
               ':(exclude,glob)**/*.spec.ts'  ':(exclude,glob)**/*.spec.tsx'
               ':(exclude,glob)tests/**'      ':(exclude,glob)e2e/**')

          PAT='^\+.*(@ts-ignore|@ts-nocheck|@ts-expect-error|eslint-disable|\bas any\b|\bas unknown as\b|:[[:space:]]*any\b|catch[[:space:]]*(\([^)]*\))?[[:space:]]*\{[[:space:]]*\})'

          # La vérification vit dans .github/scripts/ — partagée avec
          # `test-integrity`, parce qu'une logique de sécurité dupliquée dérive.
          verifier() { bash .github/scripts/verify-signed-commits.sh "$@" || fail=1; }

          # ── 1. La liste des clés se protège elle-même ─────────────────────────
          # Sans cela, l'agent y ajoute sa propre clé et le garde ne vaut plus rien.
          # Toute modification doit être signée par une clé DÉJÀ présente à la base.
          if [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- "$SIGNERS")" ]; then
            if git cat-file -e "$BASE_SHA:$SIGNERS" 2>/dev/null; then
              git show "$BASE_SHA:$SIGNERS" > "$RUNNER_TEMP/base_signers"
              echo "Modification de $SIGNERS — vérification contre la liste de la base :"
              # shellcheck disable=SC2046
              verifier "$RUNNER_TEMP/base_signers" $(git rev-list --no-merges "$BASE_SHA..HEAD" -- "$SIGNERS")
            else
              echo "::warning title=Amorçage de la liste des clés::$SIGNERS n'existe pas encore à la base. Cette PR l'installe SANS preuve — c'est le seul moment où c'est possible. Poussez-la vous-même (docs/ci.md § Le garde de suppression)."
            fi
          fi

          # ── 2. Les suppressions introduites par cette PR ──────────────────────
          offenders=()
          for c in $(git rev-list --no-merges "$BASE_SHA..HEAD"); do
            if git show --format= --unified=0 "$c" -- "${SRC[@]}" | grep -qE "$PAT"; then
              offenders+=("$c")
            fi
          done

          if [ ${#offenders[@]} -eq 0 ]; then
            echo "Aucune suppression du vérificateur introduite."
            exit $fail
          fi

          echo "Suppressions introduites par ${#offenders[@]} commit(s) :"
          for c in "${offenders[@]}"; do
            echo "── $c — $(git log -1 --format=%s "$c")"
            git show --format= --unified=0 "$c" -- "${SRC[@]}" | grep -nE "$PAT" | sed 's/^/    /'
          done

          verifier "$SIGNERS" "${offenders[@]}"
          exit $fail

  # ── Bloquant · diff de la config qualité ──────────────────────────────────────
  # SOUPAPE obligatoire, sinon ce contrôle bloquerait sa propre maintenance :
  # le changement est autorisé si TOUS les commits qui y touchent portent un scope
  # explicite, ou si la PR porte le label `config-change`. Jamais en silence.
  #
  # Surveille aussi les fichiers qui contraignent l'AGENT lui-même : un CLAUDE.md ou
  # un .claude/settings.json réécrit en silence désarme les consignes avant qu'aucun
  # autre contrôle ne s'en aperçoive.
  quality-config-guard:
    name: quality-config-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Config qualité figée
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'config-change') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          if [ -z "${BASE_SHA:-}" ]; then
            echo "::notice title=Hors portée::Pas d'événement pull_request — aucun diff à inspecter."
            exit 0
          fi

          CONFIG=(':(glob)eslint.config.*'   ':(glob).eslintrc*'
                  ':(glob)tsconfig*.json'    ':(glob)**/tsconfig*.json'
                  ':(glob)vitest.config.*'   ':(glob)**/vitest.config.*'
                  ':(glob)playwright.config.*'
                  ':(glob)stryker.conf.*'    ':(glob)knip.*'
                  ':(glob)prettier.config.*' ':(glob).prettierrc*'
                  ':(glob).prettierignore'   ':(glob).eslintignore'
                  ':(glob)pnpm-workspace.yaml'
                  ':(glob).github/workflows/**'
                  ':(glob).github/scripts/**'
                  ':(glob)CLAUDE.md'         ':(glob)AGENTS.md'
                  ':(glob).claude/**')
          fail=0

          verifier_scopes() {
            # $@ : pathspecs. Chaque commit qui touche ces chemins doit porter un scope.
            for c in $(git log --format=%H "$BASE_SHA"..HEAD -- "$@"); do
              msg=$(git log -1 --format=%s "$c")
              case "$msg" in
                chore\(ci\):*|chore\(config\):*|build\(ci\):*|chore\(agent\):*) ;;
                *)
                  echo "::error title=Config qualité modifiée sans scope::$c — $msg"
                  fail=1 ;;
              esac
            done
          }

          # a. Les fichiers de configuration eux-mêmes.
          if [ -n "$(git diff --name-only "$BASE_SHA"...HEAD -- "${CONFIG[@]}")" ]; then
            verifier_scopes "${CONFIG[@]}"
          fi

          # b. Les scripts du portail dans package.json. Les seules lignes surveillées
          #    sont celles des commandes de contrôle : ajouter une dépendance touche
          #    package.json légitimement et ne doit pas faire de bruit.
          scripts_touches=$(git diff "$BASE_SHA"...HEAD -- ':(glob)package.json' ':(glob)**/package.json' \
            | grep -E '^[-+][[:space:]]*"(test|typecheck|lint|build|coverage|knip|mutation)"[[:space:]]*:') || true
          if [ -n "$scripts_touches" ]; then
            echo "Scripts du portail touchés :"
            echo "$scripts_touches"
            verifier_scopes ':(glob)package.json' ':(glob)**/package.json'
          fi

          exit $fail
