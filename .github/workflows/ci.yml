# Portail de contrôles — ColibriCMS
#
# Réduit le 2026-09-06 aux deux seuls jobs `build` et `test`, lors de la bascule
# d'outillage vers scd-spec-dev (OpenSpec). Ont été retirés :
#   · les gardes    : arch-invariants · boundaries · workflow-integrity ·
#                     test-integrity · quality-config-guard · verifier-guard ·
#                     specs-integrity
#   · les scans     : sca · secrets · dependency-review
#   · les informatifs : lint · coverage · sast
#
# Le ruleset « Main protect » n'exige plus AUCUN status check (il ne garde que
# PR obligatoire, anti-force-push et anti-suppression de `main`) : `build` et
# `test` tournent encore et annotent la PR, mais ne la bloquent plus.
# docs/ci.md décrit encore l'ancien portail à DOUZE bloquants — à réaligner.
#
# Les actions restent épinglées au SHA complet et les images au DIGEST.

name: CI

on:
  # `labeled` / `unlabeled` conservés : sans eux, poser un label ne relance rien.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── build · dizaines de secondes ────────────────────────────────────────────
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      # `npm ci` et jamais `npm install` : sans version figée, la SCA scannerait
      # autre chose que ce qui est installé et ne prouverait rien.
      - if: steps.scaffold.outputs.ok == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.ok == 'true'
        run: npm run typecheck
      - if: steps.scaffold.outputs.ok == 'true'
        run: npm run build
      # ── Garde-fou C5 · le plafond porte sur la SORTIE du build ──────────────
      # Une photographie produit 5 fichiers avec la configuration d'images
      # retenue (docs/1.x/stack.md § Le garde-fou C5). Le mur de la plateforme est
      # à 20 000 fichiers ; l'alerte du socle de livraison à 15 000.
      - if: steps.scaffold.outputs.ok == 'true'
        run: |
          set -uo pipefail
          if [ ! -d dist ]; then
            echo "::notice title=Hors portée::Aucun répertoire dist/ — rien à compter."
            exit 0
          fi
          n=$(find dist -type f | wc -l)
          echo "Fichiers produits : ${n}"
          if [ "$n" -ge 20000 ]; then
            echo "::error title=C5 franchi::${n} fichiers produits — le plafond de la plateforme est 20 000."
            exit 1
          elif [ "$n" -ge 15000 ]; then
            echo "::warning title=C5 en alerte::${n} fichiers produits — l'alerte du socle de livraison est à 15 000."
          fi

  # ── test · minutes ──────────────────────────────────────────────────────────
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: scaffold
        run: |
          if [ -f package.json ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hors portée::Aucun package.json — scaffold absent, ce contrôle ne vérifie rien (docs/ci.md)."
          fi
      - if: steps.scaffold.outputs.ok == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - if: steps.scaffold.outputs.ok == 'true'
        run: npm ci
      - if: steps.scaffold.outputs.ok == 'true'
        run: npm test
